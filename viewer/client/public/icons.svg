<title id="title">Lexicon icon set</title>
<desc id="desc">Thirty-one original icons on a 20-unit grid. Four model objects, five DDD classifications, annotations, and viewer controls. Each glyph is shown at 28 and 16 pixels. Reuse symbols by their IDs.</desc>
