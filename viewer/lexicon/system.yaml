schemaVersion: "0.3"
kind: system
id: lexicon-viewer
name: Lexicon viewer
purpose: |
  A local web app for browsing a lexicon-conform project's cold layer (DDD-style
  ubiquitous language: bounded contexts, terms, invariants, aggregates, shared
  kernels, surfaces and regions) and its codebase in the same window. Two peer
  views — a reading room (catalog + detail + Monaco peek drawer) and a graph
  view (typeset diagram with two lenses). Single-user, single-project-at-a-time,
  read-only.

narrative: |
  The viewer is a *reading room*, not an IDE. A [[kernel/viewer-vocabulary/lexicon-conform-project]]
  declares its [[kernel/viewer-vocabulary/cold-layer]] as YAML; [[context/project-registry]]
  persists the user's registered paths and serves files; [[context/lexicon-loading]] parses
  the YAML into a flat [[lexicon-loading/resolved-graph]] keyed by
  [[kernel/viewer-vocabulary/fqid]]. From there the graph splits into two peer surfaces
  sharing one [[kernel/viewer-vocabulary/peek]] drawer.

  The first surface is the reading room ([[surface/reading-room]]) — a
  three-pane shell where the left catalog navigates by bounded context, the
  centre column reads one entity in depth, and the right rail opens
  [[kernel/viewer-vocabulary/code-anchor]]s as live Monaco peeks. The second is the
  graph view ([[surface/graph-view]]): [[context/graph-model]] projects the same
  `ResolvedGraph` through one of two [[graph-model/lens]]es, ELK lays it out, and a
  custom SVG renders it with the editorial aesthetic. Peeks persist across the view
  toggle ([[design-system/invariant/peek-persists-across-surfaces]]) so the drawer
  never resets when the user switches.

  Two things are deliberately load-bearing. The viewer never writes
  ([[kernel/viewer-vocabulary/invariant/read-only]]) — corrections go back through
  `lex-crystallize` in the terminal, not through this app. And the visual identity
  ([[kernel/viewer-vocabulary/invariant/editorial-aesthetic]]) is treated as design
  constraint, not decoration; capability tradeoffs lose to aesthetic ones.
  Everything else — the lens semantics, the path-clamp
  ([[project-registry/path-clamp]]) — descends from those two commitments.

contexts:
  - lexicon-loading
  - project-registry
  - graph-model
  - design-system

sharedKernels:
  - id: viewer-vocabulary
    name: Viewer vocabulary
    description: |
      The viewer-wide nouns and invariants every context coordinates on:
      the fqid format, the code-anchor shape, the read-only and
      single-project-active commitments, the editorial aesthetic. A pragmatic
      kernel — strict-DDD might prefer a published-language seam between
      every context pair, but pinning these as a kernel keeps the definitions
      together with their atoms.
    participatingContexts:
      - lexicon-loading
      - project-registry
      - graph-model
      - design-system
    rationale: |
      Lifting these to one kernel keeps them traversable as a graph (every
      `[[fqid]]` link resolves through a stable fqid) while making it
      explicit that no single context owns them.
    terms:
      - id: lexicon-conform-project
        name: lexicon-conform project
        category: concept
        definition: |
          A project that contains a top-level `lexicon/` directory of YAML files
          conforming to schema v0.3 — `system.yaml`, optional per-context files in
          `contexts/`, optional `surfaces/*.yaml`. The viewer's input. Registered
          with the viewer by absolute path.

      - id: cold-layer
        name: cold layer
        category: concept
        definition: |
          The structured YAML files under `lexicon/` that capture vocabulary,
          invariants, bounded contexts, aggregates, shared kernels, and the
          rationale arguments that justify them. Distinct from the hot layer
          (per-feature plans in `lexicon/plans/`) and from code itself. The
          viewer reads the cold layer; it does not write it.

      - id: fqid
        name: fqid (fully-qualified id)
        category: value
        definition: |
          A stable string identifier for any resolved entity, unique across the
          graph. Forms: `system/<slug>`, `context/<slug>`, `<context>/<term>`,
          `<context>/invariant/<slug>`, `<context>/seam/<slug>`, `<context>/rule/<slug>`,
          `<context>/aggregate/<slug>`, `<context>/module/<slug>`, `kernel/<slug>`,
          `kernel/<slug>/<term>`, `kernel/<slug>/invariant/<slug>`,
          `surface/<slug>`, `surface/<slug>/<region>`. Used as React keys, graph
          node IDs, route params (`/p/:id/<fqid>`).
        equality: |
          By string value. Two fqids are the same iff their strings match.
        symbols:
          - file: server/schema.ts
            symbol: EntityRef
          - file: server/loader.ts
            symbol: register

      - id: code-anchor
        name: code anchor
        category: value
        definition: |
          A pointer from a cold-layer entity into a code file: `{file, lineStart?,
          lineEnd?, symbol?}`. Lives on `Term.symbols`, `Invariant.constrainsCode`,
          and `Region.implementation` (inline variant carries `file/lineStart/lineEnd`,
          component variant carries `import` with optional `file`). The viewer
          renders anchors as badges that open the file in a Monaco peek.
        equality: |
          Structural — same file, same line range, same symbol.
        symbols:
          - file: server/schema.ts
            symbol: codeAnchor

      - id: peek
        name: peek
        category: concept
        definition: |
          A Monaco editor instance opened in a side drawer to read the file behind
          a code anchor, with the anchor's line range highlighted. Multiple peeks
          stack vertically. State lives in a React context (`PeekProvider`) so
          peeks persist across view changes (reading room ↔ graph view).
          Read-only — the peek shows the file as-on-disk; the viewer never writes.
        symbols:
          - file: client/src/lib/peek.tsx
            symbol: PeekProvider
          - file: client/src/components/PeekDrawer.tsx

    invariants:
      - id: read-only
        name: viewer is read-only
        statement: |
          The viewer never writes to cold-layer YAML, never modifies code, and
          never mutates the user's filesystem outside `lexicon-viewer.db`.
          Corrections go through `lex-crystallize` running in the user's terminal,
          not through the viewer.
        rationale: |
          Editing in the viewer would duplicate `lex-crystallize`'s deliberate
          propose-then-apply discipline, and likely badly — the viewer has no
          access to the full conversational context that makes crystallization
          good. Keep the viewer a *reading room*, not an IDE.
        validationMode: principle

      - id: single-project-active
        name: one project active at a time
        statement: |
          The browser loads exactly one project's `ResolvedGraph` at a time. The
          search index, recency cache, and peek state are scoped to that project.
          Switching projects reloads everything from scratch.
        rationale: |
          Single-project scope keeps the in-browser index small (linear scan over
          hundreds of entities), routing simple (`/p/:id/...`), and the mental
          model uncluttered. Cross-project features (if ever) would be a separate
          surface, not a graph-layer concern.
        validationMode: principle

      - id: editorial-aesthetic
        name: editorial-meets-blueprint aesthetic
        statement: |
          The viewer's visual identity (Fraunces + IBM Plex Mono on ink/vellum
          with oxide accents, sharp geometry, hairline rules, no rounded badges,
          no purple defaults) is load-bearing — a correct-but-generic viewer
          would feel like a downgrade from the YAML it renders. Canonical
          vocabulary and component primitives live in [[context/design-system]];
          surfaces consume from there rather than declaring their own colors,
          fonts, or shapes.
        rationale: |
          The aesthetic is the differentiator. When adding a feature, push the
          typography and edge styling until it reads as "extension of the
          existing viewer," not "bolted on." If a tradeoff arises between
          capability and aesthetic, the aesthetic wins.

          The layout layer (ELK.js) and rendering layer (custom SVG) were chosen
          for this reason: Cytoscape / react-flow / d3-force all *work*, but
          their default node aesthetics fight the editorial direction.
          Layout-only ELK plus our own SVG keeps full control of typography and
          edge styling. The trade is engineering cost — we own pan/zoom,
          hover-dim, selection state, and routing — and it's been worth it.
        validationMode: principle

deliberateOmissions:
  - topic: Editing the cold layer in the viewer
    reason: |
      Corrections route back through `lex-crystallize` in the user's terminal,
      not through this app. Adding an in-viewer editor would duplicate the
      crystallize discipline (propose, get user yes, apply) and likely badly —
      the viewer has no access to the conversational context that makes
      crystallization good. See [[kernel/viewer-vocabulary/invariant/read-only]].
    triggers:
      - A clear use case where terminal round-trip blocks routine fixes
        (e.g. typo in a `name` field for a heavily-renamed entity).
      - Crystallize itself moves into a non-terminal context.
    relatedAtoms:
      - kernel/viewer-vocabulary/invariant/read-only
      - kernel/viewer-vocabulary/peek

  - topic: Multi-project graphs (cross-project queries)
    reason: |
      The browser loads exactly one project's [[lexicon-loading/resolved-graph]]
      at a time ([[kernel/viewer-vocabulary/invariant/single-project-active]]).
      Cross-project features — finding every shared term that mentions a concept,
      diffing two projects' contexts — would change the routing shape
      (`/p/:id/...` no longer scopes everything) and inflate the in-browser
      index. Not blocking; no real demand yet.
    triggers:
      - Two or more projects start sharing a meaningful term vocabulary.
      - A user asks "where in any of my projects did I…".
    relatedAtoms:
      - kernel/viewer-vocabulary/invariant/single-project-active

  - topic: Real-time refresh on filesystem changes
    reason: |
      Today the user clicks Refresh; the loader re-reads and the
      [[lexicon-loading/mtime-cache]] is cleared globally. A filesystem
      watcher would push updates automatically, but the manual click is a
      strong intentional signal ([[lexicon-loading/cache-invalidates-on-refresh]])
      and avoids partial-write races on long YAML edits. Polish-bundle plan
      considers this; not committed.
    triggers:
      - User complains the click cadence breaks flow during heavy crystallize
        sessions.
    relatedAtoms:
      - lexicon-loading/mtime-cache
      - lexicon-loading/cache-invalidates-on-refresh
