schemaVersion: "0.1"
kind: decision
id: ADR-0001
title: Use ELK.js for layout and custom SVG for rendering
date: 2026-05-12
status: accepted
affects:
  - graph-model
  - graph-model/lens
  - graph-model/affects-routing
  - design-system
context: |
  The Path B graph view needs to render a compound graph: bounded contexts as
  containers with terms / invariants / seams / boundary rules nested, plus
  ADRs floating outside with `affects` edges, plus a separate surfaces lens.
  Edges cross container boundaries (a term's `disambiguates-from` may point
  into another context). The viewer's editorial-meets-blueprint aesthetic
  is load-bearing — typography (Fraunces, Plex Mono), sharp geometry, hairline
  rules — and a "correct-but-generic" graph would feel like a downgrade from
  the reading room.
decision: |
  Layout: **ELK.js** (Eclipse Layout Kernel, JS port). It handles compound
  graphs (nested containers) natively, offers `layered` and `mrtree`
  algorithms suited to the lens variants, and is layout-only — no rendering
  opinions. Run it in a Web Worker to keep the UI responsive.

  Rendering: **custom SVG**. Full control over typography and edge styling.
  No "fighting the library to remove its defaults." SVG renders Fraunces and
  Plex Mono crisply, which is exactly what we need.
consequences: |
  Engineering cost is higher than picking a one-shot React graph library: we
  own node rendering, edge rendering, pan/zoom, hover-dim, selection state,
  and the affects-routing modes. In exchange: the diagram looks like an
  extension of the reading room, not a bolted-on dashboard widget.

  Layout perf: ELK is fine for the sample lexicon (~50 entities) and expected
  real-project size (~500). If it stalls on much larger graphs, fall back to
  **dagre** for layered ordering and hand-roll the containment logic. Do not
  switch preemptively — measure first.
alternatives: |
  - **Cytoscape.js** — full-featured but heavy, opinionated styling. Hard to
    make typographically distinctive. Rejected.
  - **react-flow / reaflow** — React-native graph libs. Good DX but their
    default node components carry a strong aesthetic prior (rounded purple
    nodes) that fights the editorial direction. Customization would defeat
    the time savings. Rejected.
  - **d3-force** — low-level, full control, but force-directed layouts
    produce blobs that don't read as "ownership hierarchy." Would need
    significant constraint work to match the brief. Rejected.
  - **vis-network / dagre / mermaid** — each is either heavy, dated, or
    non-interactive. Rejected, though dagre survives as a fallback if ELK
    fails on scale.
