schemaVersion: "0.1"
kind: bounded-context
id: lexicon-loading
name: Lexicon loading
purpose: |
  Read a lexicon-conform project's YAML files from disk, validate them against
  schema v0.1 with zod, resolve typed cross-references between entities, and
  produce a `ResolvedGraph` the client can render. Surfaces load issues
  (parse errors, schema errors, dangling refs) without failing the whole load.
modules:
  - server/schema.ts
  - server/loader.ts

terms:
  - id: resolved-graph
    name: ResolvedGraph
    definition: |
      The post-load representation delivered to the client. Holds `system`
      (the system root entity), `entities` (a flat map of fqid → ResolvedEntity),
      `byKind` (fqids grouped by entity kind), `issues` (LoadIssues collected
      during parse + resolve), and `projectRoot`. The full structure ships over
      the wire on every `GET /api/projects/:id/lexicon`.
    symbols:
      - file: server/schema.ts
        lineStart: 229
        lineEnd: 235
        symbol: ResolvedGraph

  - id: resolved-entity
    name: ResolvedEntity
    definition: |
      One node of the `ResolvedGraph`. Carries a typed `ref: EntityRef`, the
      `ownerContextId` (null for system-level / decisions / surfaces), the
      `source.file` for git history and audit purposes, and entity-kind-specific
      typed fields (definition, statement, rationale, body, anchors, …). Every
      cold-layer entity — system, bounded-context, term, invariant, seam,
      boundary-rule, decision, surface, region — becomes one ResolvedEntity.
    symbols:
      - file: server/schema.ts
        lineStart: 178
        lineEnd: 221
        symbol: ResolvedEntity

  - id: entity-ref
    name: EntityRef
    definition: |
      The smallest pointer to an entity: `{kind, fqid, name}`. Used everywhere
      the graph references another entity (disambiguatesFrom, affects,
      supersedes, contains, regions, supersededBy). Cheap to embed in many
      places without duplicating prose.
    symbols:
      - file: server/schema.ts
        lineStart: 172
        lineEnd: 176
        symbol: EntityRef

  - id: load-issue
    name: LoadIssue
    definition: |
      A single parse / schema / resolution failure: `{file, message, severity}`
      with severity `error` (file couldn't be loaded) or `warning` (loaded but
      something inside is wrong — typically a dangling ref). Issues ride along
      with `ResolvedGraph.issues`; the loader never throws on a bad file.
    symbols:
      - file: server/schema.ts
        lineStart: 223
        lineEnd: 227
        symbol: LoadIssue

  - id: ref-resolution
    name: ref resolution
    definition: |
      The second pass of the loader, where slug-form refs in YAML (e.g. a
      term's `disambiguatesFrom: [other-term]`) are looked up against the
      registered entity map. The resolver tries owner-scoped lookups first
      (sibling in the same context), then qualified forms (`<ctx>/<slug>`),
      then common shorthands (`term/<slug>`, `decision/<slug>`, …). Unresolved
      refs become warnings — they don't block the load.
    symbols:
      - file: server/loader.ts
        lineStart: 240
        lineEnd: 282
        symbol: resolveRef

  - id: mtime-cache
    name: mtime cache
    definition: |
      The loader keeps a per-`projectRoot` cache keyed by the latest mtime
      across all YAML files in the project's `lexicon/` dir. A subsequent
      load with the same latest-mtime returns the cached `ResolvedGraph`
      without re-parsing. The cache is invalidated explicitly on `refresh=1`
      query and on project removal.
    symbols:
      - file: server/loader.ts
        lineStart: 15
        symbol: cache
      - file: server/loader.ts
        lineStart: 351
        symbol: invalidateCache

invariants:
  - id: fqid-unique
    name: fqid uniqueness within a graph
    statement: |
      Every entity registered in a `ResolvedGraph` has a globally unique
      `fqid`. Duplicates surface as an error `LoadIssue` and the second
      registration is dropped.
    rationale: |
      `fqid`s are used as React keys, route params, and graph node IDs.
      Duplicates would silently break navigation and rendering. Surfacing as
      a load-time error lets the user fix the YAML before debugging UI glitches.
    validationMode: code
    constrainsCode:
      - file: server/loader.ts
        lineStart: 115
        lineEnd: 122
        symbol: register

  - id: loader-never-throws
    name: bad YAML produces issues, not exceptions
    statement: |
      Any single-file failure (read error, YAML parse error, schema mismatch,
      dangling ref) is recorded as a `LoadIssue` and the loader continues with
      the remaining files. The graph response is always well-formed JSON.
    rationale: |
      The viewer is a triage surface as much as a reader — it should help the
      user *see* problems in their cold layer, not refuse to render when one
      file is broken. Forward progress beats fail-fast in a read-only tool.
    validationMode: code
    constrainsCode:
      - file: server/loader.ts
        lineStart: 38
        lineEnd: 76

  - id: cache-invalidates-on-refresh
    name: refresh=1 invalidates the cache globally
    statement: |
      `GET /api/projects/:id/lexicon?refresh=1` calls `invalidateCache()` with
      no argument, clearing every project's cached graph. Subsequent loads
      re-read from disk.
    rationale: |
      The viewer is a single-user dev tool; the user clicking "Refresh" is the
      strong signal that they want fresh data. Clearing all caches keeps the
      logic simple and avoids "stale despite refresh" surprises if the file
      mtime hasn't changed (e.g., a `touch -m` of the same content).
    validationMode: code
    constrainsCode:
      - file: server/index.ts
        lineStart: 41
        lineEnd: 50

  - id: ref-resolution-is-warning
    name: dangling refs are warnings, not errors
    statement: |
      An unresolved ref (e.g., a term's `disambiguatesFrom` pointing at a slug
      no entity claims) produces a `severity: warning` LoadIssue, not an
      error. The owning entity loads with that ref simply absent from its
      resolved field.
    rationale: |
      Real lexicon authoring often involves renames mid-flight; a dangling ref
      is a signal to fix in `lex-crystallize`, not a load failure. Same
      forward-progress principle as `loader-never-throws`.
    validationMode: code
    constrainsCode:
      - file: server/loader.ts
        lineStart: 280
        symbol: resolveRef
