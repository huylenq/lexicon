schemaVersion: "0.1"
kind: bounded-context
id: project-registry
name: Project registry
purpose: |
  Persist the set of projects the user has registered, expose them over the
  HTTP API, and safely serve files from any registered project's tree to the
  Monaco peek drawer. SQLite-backed (`lexicon-viewer.db`); single-process,
  single-user.
modules:
  - server/db.ts
  - server/index.ts

terms:
  - id: project
    name: Project
    definition: |
      A row in the `projects` SQLite table: `{id, name, root_path, added_at,
      last_opened_at}`. `root_path` is absolute, unique, and must point at an
      existing directory at register time (re-checked only on register, not on
      every load). The project's lexicon is read from `<root_path>/lexicon/`.
    symbols:
      - file: server/db.ts
        lineStart: 19
        lineEnd: 25
        symbol: ProjectRow

  - id: project-root
    name: project root
    definition: |
      The absolute filesystem path the loader and file-serving routes scope
      their work to. Stored in `Project.root_path`. All path operations
      (YAML walk, file read, future git shell-out) resolve relative to this
      root and refuse to escape it.

  - id: path-clamp
    name: path clamp
    definition: |
      The safety check applied to every file path requested over
      `/api/projects/:id/file?path=…`: resolve the requested path against the
      project root, compute the relative path, and reject if it starts with
      `..` or is absolute. Prevents `?path=../../etc/passwd`-style escape.
    symbols:
      - file: server/index.ts
        lineStart: 54
        lineEnd: 70

invariants:
  - id: rootpath-absolute
    name: rootPath must be absolute and an existing directory
    statement: |
      `POST /api/projects` rejects (`400`) any `rootPath` that is empty,
      relative, missing, or not a directory.
    rationale: |
      Relative paths are ambiguous (relative to what?) and would silently
      land in the server's CWD. Refusing them at register time means the
      stored `root_path` is always safe to feed into `resolve()` and `stat()`.
    validationMode: code
    constrainsCode:
      - file: server/index.ts
        lineStart: 14
        lineEnd: 30

  - id: file-escape-rejected
    name: file-serving rejects path escape
    statement: |
      The `/api/projects/:id/file` route resolves the requested path under
      the project root and rejects (`400 path escape`) any request whose
      resolved path is outside the root — i.e. its relative form starts with
      `..` or is absolute after resolution.
    rationale: |
      Without this clamp, a malicious or accidental `?path=../../something`
      would serve arbitrary files from the host. The viewer is local-only
      today, but the path clamp is the real safety check; don't bypass.
      All future code-anchor opening flows must route through this endpoint.
    validationMode: code
    constrainsCode:
      - file: server/index.ts
        lineStart: 60
        lineEnd: 63

  - id: unique-rootpath
    name: rootPath is unique across projects
    statement: |
      The `projects.root_path` column has a UNIQUE constraint. Inserting a
      duplicate raises a SQLite error, which the POST handler surfaces as a
      `400`.
    rationale: |
      Registering the same directory twice would produce two `Project` rows
      racing to be "the" project for that path — visible UI duplication and
      confusing recency. Uniqueness keeps the registry a set, not a multiset.
    validationMode: code
    constrainsCode:
      - file: server/db.ts
        lineStart: 9
        lineEnd: 17
