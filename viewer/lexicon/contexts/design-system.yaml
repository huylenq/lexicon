schemaVersion: "0.3"
kind: bounded-context
id: design-system
name: Design system
subdomain: supporting
purpose: |
  The shared visual vocabulary of the viewer: design tokens (color, typography,
  geometry), the `lexicon-ink` Monaco theme, and the small family of reusable
  primitives that appear across surfaces (`RefLink`, `InlineCode`,
  `CodeAnchorBadge`, `PeekDrawer`, `Marginalia`). Owns the editorial-meets-
  blueprint aesthetic; surfaces consume from this context rather than declaring
  their own colors / fonts / shapes.

narrative: |
  Tokens, primitives, theme — in that order. The [[design-tokens]] are the
  single canonical source for color, typography, and geometry; raw hex
  literals outside `styles/index.css` are vocabulary drift
  ([[tokens-are-source-of-color]]). Every surface consumes via Tailwind
  utilities or `var(--color-…)`; the palette is small and load-bearing.

  Above the tokens sit a small family of primitives every surface uses:
  [[ref-link]] for entity references, [[inline-code]] for backtick-spanning
  names, [[code-anchor-badge]] as the *only* entry point that opens a peek,
  [[peek-drawer]] as the Monaco host, [[marginalia]] for the right-rail
  metadata layout. Bypassing them (raw `<a>`, hand-rolled span splits, direct
  `usePeek` calls) re-implements the affordance and loses visual consistency
  ([[primitives-not-raw-html]]).

  The [[lexicon-ink-theme]] is the Monaco theme defined once in
  `PeekDrawer.tsx`: vs-dark base, vellum on ink-2, oxide-tinted line
  decoration. Every peek inherits it. A single `PeekProvider` wraps every
  project surface ([[peek-persists-across-surfaces]]) — switching
  [[surface/reading-room]] ↔ [[surface/graph-view]] never closes peeks or
  drops scroll position.
  The Light Table moment is the affordance the drawer carries; resetting on a
  toggle would defeat the point.

terms:
  - id: design-tokens
    name: design tokens
    category: concept
    definition: |
      Tailwind v4 `@theme` block: `--color-ink`, `--color-ink-2/3/4`,
      `--color-rule`, `--color-vellum`, `--color-vellum-2/3`, `--color-oxide`,
      `--color-oxide-2`, `--color-saffron`; `--radius-card: 0`, `--radius-pill:
      2px`; font families bound to Fraunces (display) and IBM Plex Mono (mono).
      Defined once in `styles/index.css`; consumed via Tailwind utility classes
      or `var(--color-…)` in inline styles.
    symbols:
      - file: client/src/styles/index.css
        lineStart: 1
        symbol: "@theme"

  - id: ref-link
    name: RefLink
    category: concept
    definition: |
      The clickable entity-reference primitive. Renders a `<Link>` to the
      target entity's route with the kind glyph (`T` / `I` / `D` / `Sf` / …)
      in mono micro plus the display name via `InlineCode`. The 1px oxide
      underline visual signature for in-prose references comes from the
      `ref-link` CSS class.
    symbols:
      - file: client/src/components/RefLink.tsx
        symbol: RefLink

  - id: inline-code
    name: InlineCode
    category: concept
    definition: |
      Renders an entity name whose body may contain backtick-wrapped code
      spans (`InlineCode text="like \`this\`"`). Spans inside backticks
      render in IBM Plex Mono so identifiers read as code rather than as
      literal words. Used everywhere a `ref.name` is shown.
    symbols:
      - file: client/src/components/InlineCode.tsx
        symbol: InlineCode

  - id: code-anchor-badge
    name: CodeAnchorBadge
    category: concept
    definition: |
      Clickable badge that opens its `CodeAnchor` as a peek in the drawer.
      Displays the relative file path, the formatted line range, and the
      symbol if present. The only entry point that opens peeks — both
      surfaces route through it.
    symbols:
      - file: client/src/components/CodeAnchorBadge.tsx
        symbol: CodeAnchorBadge

  - id: peek-drawer
    name: PeekDrawer
    category: concept
    definition: |
      The Monaco-hosting drawer that renders each open `Peek` as a small
      editor (`@monaco-editor/react`) with the `lexicon-ink` theme and line
      decorations highlighting the anchored range. Multiple peeks stack
      vertically. Width persisted via `usePersistedWidth`. Shared across
      reading-room and graph-view surfaces.
    symbols:
      - file: client/src/components/PeekDrawer.tsx

  - id: marginalia
    name: Marginalia
    category: concept
    definition: |
      Two-component pair (`<Marginalia>` + `<MarginaliaItem label=…>`) that
      lays out the right-rail metadata for an entity: owner (context or
      kernel), validation mode, disambiguatesFrom, upstream/downstream
      (seams), participants, code anchors, codeModules, source file. Each
      item is a smallcap label over a small column of content.
    symbols:
      - file: client/src/components/Marginalia.tsx

  - id: lexicon-ink-theme
    name: lexicon-ink Monaco theme
    category: concept
    definition: |
      The Monaco editor theme defined once in `PeekDrawer.tsx`'s `defineTheme`:
      vs-dark base, vellum text on ink-2 background, oxide-tinted line
      decoration. Applied to every peek. `plans/git-history/spec.md` notes a
      planned extraction into `lib/monaco-theme.ts` so HistoryTimeline can
      share it.
    symbols:
      - file: client/src/components/PeekDrawer.tsx
        symbol: defineTheme

invariants:
  - id: tokens-are-source-of-color
    name: colors come from tokens, not literals
    statement: |
      Color values in component code reference `var(--color-…)` or the
      Tailwind utility derived from the `@theme` block. Raw hex / rgb / hsl
      literals outside `styles/index.css` are vocabulary drift.
    rationale: |
      The editorial palette is small and load-bearing; an inline `#b8472d`
      somewhere is a future-rename hazard and obscures intent. The token
      file is the canonical source — keep it that way so palette evolution
      stays a single-file edit. lex-audit flags hex literals outside
      `styles/index.css` per the design-system signals in lex-overview.
    validationMode: linter
    constrainsCode:
      - file: client/src/styles/index.css

  - id: peek-persists-across-surfaces
    name: peek state persists across surfaces
    statement: |
      A single `PeekProvider` wraps every project surface (`/p/:id/*`).
      Switching between reading-room and graph-view does not close open
      peeks, drop their scroll position, or re-fetch their file contents.
    rationale: |
      The Light Table moment — "everything is at your fingertips" — is the
      core affordance the peek drawer carries; losing peeks on a view
      toggle would defeat the purpose. `plans/_archive/graph-view/spec.md` is
      explicit about this; any future surface added under `/p/:id/...` must
      mount inside the existing provider, not its own.
    validationMode: principle
    constrainsCode:
      - file: client/src/pages/ProjectPage.tsx
        lineStart: 16
        lineEnd: 21
        symbol: ProjectPage

  - id: primitives-not-raw-html
    name: shared primitives, not raw HTML
    statement: |
      Entity refs route through `<RefLink>`, not raw `<Link>` or `<a>`.
      Code anchors route through `<CodeAnchorBadge>`, not direct `usePeek`
      calls. Names with backtick spans route through `<InlineCode>`, not
      hand-rolled span splits.
    rationale: |
      The primitives carry the underline, the glyph, the peek-open behavior,
      and the inline-code-span discipline. Bypassing them means re-implementing
      the affordance and losing the visual consistency that lets the viewer
      read as one document rather than a patchwork.
    validationMode: principle
