schemaVersion: "0.3"
kind: bounded-context
id: graph-model
name: Graph model
subdomain: core
purpose: |
  Convert the server's `ResolvedGraph` into a renderable diagram. Build a
  lens-specific node/edge model from the cold layer, hand it to ELK.js for
  layout, then render as custom SVG. Two lenses (ownership / surfaces) plus
  per-lens edge styling, kind filters, and context filters.

narrative: |
  Three steps and the user sees a diagram. First, `buildModel(graph, lens,
  opts)` projects [[lexicon-loading/resolved-graph]] into a flat list of
  [[graph-node]]s and [[graph-edge]]s — the [[lens]] decides which entities
  become nodes and which relationships become edges. Containers
  (bounded-contexts and shared-kernels in the ownership lens, surfaces in the
  surfaces lens) handle the compound-graph nesting. The set of lenses is
  closed at the type level ([[lens-set-closed]]).

  Second, ELK lays it out — given the same model and options, the same
  positions come out every time ([[layout-deterministic]]). Filter toggles
  rebuild the model and re-run layout rather than fading nodes in place
  ([[filter-relayout]]): the editorial choice is "the diagram reshapes,"
  not "things slide around."

  Third, a custom SVG component renders the [[layout-result]] with the
  editorial aesthetic. Nothing graph-specific lives on the server: the
  graph view consumes the same `LexiconResponse` the reading room does
  ([[resolved-graph-to-model]]).

terms:
  - id: lens
    name: lens
    category: value
    equality: |
      By string value (`"ownership" | "surfaces"`). Two lens values are the
      same iff their strings match.
    definition: |
      A named projection of the `ResolvedGraph` answering one structural
      question. Two exist: **ownership** (bounded contexts and shared kernels
      as compound containers with their owned atoms — terms, invariants,
      seams, boundary rules, aggregates, modules — nested inside, primary
      lens), and **surfaces** (surfaces as containers with regions nested).
      The lens is part of the URL: `/p/:id/graph/<lens>`.
    symbols:
      - file: client/src/lib/graph/build-graph.ts
        lineStart: 6
        lineEnd: 7
        symbol: LENSES

  - id: graph-node
    name: GraphNode
    category: value
    definition: |
      One node in the renderable graph model: `{id, kind, name, parent?,
      isCluster?, width, height}`. `id` is the entity's fqid (or a synthetic
      `__cluster/...` for cross-cutting / ADR pseudo-containers). `parent`
      makes it a child in a compound graph. Width/height are pre-layout size
      hints — set to 0 for containers (ELK computes from children).
    symbols:
      - file: client/src/lib/graph/build-graph.ts
        lineStart: 17
        lineEnd: 27
        symbol: GraphNode

  - id: graph-edge
    name: GraphEdge
    category: value
    definition: |
      One typed edge in the model: `{id, source, target, kind, label?,
      directed}`. `kind` is one of `disambiguates | seam | boundary-rule |
      contains | narrative`; each kind is rendered with its own aesthetic
      (solid oxide / dashed vellum / dotted saffron / arrow style). Two
      vestigial kinds (`affects`, `supersedes`) survive in the type union for
      compatibility with the v0.2 fanout-routing infrastructure but are never
      emitted under v0.3 since ADRs were removed.
    symbols:
      - file: client/src/lib/graph/build-graph.ts
        lineStart: 9
        lineEnd: 22
        symbol: EdgeKind

  - id: cluster-node
    name: cluster node
    category: value
    definition: |
      A synthetic compound-graph container that holds entities sharing no
      bounded context but belonging together visually. In v0.3 the primary
      use is for layout sub-grouping inside the ownership lens; the v0.2
      cross-cutting and decisions clusters are gone (shared kernels now
      render as real compound containers, ADRs were removed). Distinguished
      from real bounded-context containers by `kind: "cluster"` and the
      `__cluster/` id prefix.
    symbols:
      - file: client/src/lib/graph/build-graph.ts

  - id: affects-routing
    name: affects routing
    category: concept
    status: deprecated
    definition: |
      Vestigial strategy for drawing ADR→entity `affects` edges from v0.2.
      Four modes (`bundle` / `elbow` / `astar` / `straight`) chosen for noisy
      ADR fanout. Survives in the layout infrastructure for type compatibility
      but is dormant under v0.3 since ADRs and their affects edges are gone.
      A polish pass can rip the dead code; until then the panel chip is
      hidden by the absence of any `affects` edges in the built model.
    symbols:
      - file: client/src/lib/graph/layout.ts
        symbol: AffectsRouting

  - id: layout-result
    name: LayoutResult
    category: value
    definition: |
      What ELK + post-processing produces and the canvas consumes: a flat list
      of `PositionedNode`s (with `x, y` plus the original GraphNode fields)
      and `PositionedEdge`s (with computed routing points). The viewport size
      is implied by the bounding box of positioned nodes.
    symbols:
      - file: client/src/lib/graph/layout.ts
        lineStart: 26
        symbol: LayoutResult

invariants:
  - id: lens-set-closed
    name: lens set is closed
    statement: |
      The `LENSES` array is the complete, ordered list of supported lenses.
      A `Lens` value outside this set is impossible at the type level;
      runtime parsing of the URL lens param falls back to "ownership" if the
      route segment doesn't match.
    rationale: |
      Adding a fourth lens is intentionally heavier than a config edit — it
      requires new `build<Lens>` logic, new filter semantics, possibly new
      edge styling. Closing the set prevents accidental drift and makes the
      surface area easy to enumerate in code review.
    validationMode: code
    constrainsCode:
      - file: client/src/lib/graph/build-graph.ts
        lineStart: 6
        symbol: LENSES
      - file: client/src/pages/GraphPage.tsx
        lineStart: 24
        symbol: isLens

  - id: layout-deterministic
    name: layout is deterministic per (model, options)
    statement: |
      Given the same `GraphModel` and the same `LayoutOptions`, ELK produces
      the same node positions and edge routing. There is no per-session
      randomness, no saved layout state, and no user-drag overrides.
    rationale: |
      Determinism is what lets filter toggles "reshape the diagram" rather
      than "animate to a new state" — reproducibility comes for free, and the
      user never has to fight a layout they didn't choose. Adding free-form
      drag-to-reposition would break this invariant; see
      `plans/_archive/graph-view/spec.md` non-goals.
    validationMode: principle

  - id: filter-relayout
    name: filter changes re-run layout
    statement: |
      Toggling kind filters, context filters, or edge filters rebuilds the
      `GraphModel` and re-runs `layoutModel`. There is no fade-in-place or
      fade-out animation for filtered-out nodes.
    rationale: |
      ELK is fast enough on graphs of expected size (~50 entities for the
      sample, hundreds for real projects). Re-layout produces a cleaner
      diagram than partial-hide-and-reflow, and the editorial aesthetic is
      "the diagram reshapes" rather than "things slide around."
    validationMode: code
    constrainsCode:
      - file: client/src/pages/GraphPage.tsx
        lineStart: 65
        lineEnd: 93

seams:
  - id: resolved-graph-to-model
    name: ResolvedGraph → GraphModel
    kind: conformist
    description: |
      The graph view consumes the same `LexiconResponse` the reading room
      does; nothing graph-specific lives on the server. `buildModel(graph,
      lens, opts)` is the boundary — every lens reads only typed fields of
      `ResolvedEntity` (containedTerms, containedAggregates, regions, seam
      kind, narrative refs …), never the raw YAML.
    rationale: |
      Conformist: graph-model takes lexicon-loading's `ResolvedGraph` shape
      as-is, no translation layer. The reading room consumes the same shape;
      graph-model deliberately stays downstream of the resolved-graph
      vocabulary rather than introducing its own intermediate model.
    upstream: lexicon-loading
    downstream: graph-model
