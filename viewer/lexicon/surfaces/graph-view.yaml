schemaVersion: "0.3"
kind: surface
id: graph-view
name: Graph view
route: /p/:projectId/graph/:lens?
body: |
  Peer to the reading room. Renders the cold layer as a typeset diagram via
  ELK.js layout + custom SVG. Three lenses (ownership / decisions / surfaces);
  filter bar across the top; selected node populates a right-side detail rail
  (compact mirror of the reading room's detail). Double-click → leave graph,
  open the entity in the reading room. The peek drawer is shared via
  PeekProvider, so code anchors still open inline on the right.

regions:
  - id: filter-bar
    name: Filter bar
    role: |
      Top strip inside the graph view. Lens selector (radio row), kind
      toggles, context multiselect, edge-class toggles, search input
      (focused via `/`), and a "Layout" disclosure button that opens the
      layout-options panel.
    implementation:
      kind: component
      import: "@/components/graph/GraphFilterBar"
      file: client/src/components/graph/GraphFilterBar.tsx

  - id: canvas
    name: Canvas
    role: |
      The diagram itself. SVG with pan (drag) + zoom (wheel about cursor),
      fit-to-viewport on first paint. Nodes per kind (outlined rectangles
      with Fraunces labels), edges per kind (solid oxide / dashed vellum /
      dotted saffron). Hover highlights neighbors and dims non-neighbors to
      ~30%; click selects; double-click navigates out to the reading room.
    implementation:
      kind: component
      import: "@/components/graph/GraphCanvas"
      file: client/src/components/graph/GraphCanvas.tsx

  - id: detail-rail
    name: Detail rail
    role: |
      Right column inside the graph view. Compact rendering of the selected
      entity — definition / statement / status / affects / supersedes / code
      anchors — with a "open in reading room" link back. Resizable, width
      persists via `usePersistedWidth`.
    implementation:
      kind: component
      import: "@/components/graph/GraphDetailRail"
      file: client/src/components/graph/GraphDetailRail.tsx

  - id: layout-options-panel
    name: Layout options panel
    role: |
      Slide-up panel under the detail rail, opened from the filter bar's
      "Layout" button. Controls affects-routing mode (bundle / elbow / astar /
      straight), bundle tension, A* params (cell size, turn penalty, reuse
      factor), and an "affects focus-only" toggle that hides affects edges
      unless a node is selected.
    implementation:
      kind: component
      import: "@/components/graph/LayoutOptionsPanel"
      file: client/src/components/graph/LayoutOptionsPanel.tsx
