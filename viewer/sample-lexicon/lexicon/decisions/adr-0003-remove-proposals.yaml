schemaVersion: "0.1"
kind: decision
id: ADR-0003
title: Remove proposal staging and session sharding (v0.5.0)
date: "2026-04-28"
status: accepted
affects:
  - cold-layer/term
  - hot-layer/plan
context: >
  v0.1.0–v0.4.0 treated system.md as write-protected and routed every
  proposed edit through lexicon/plans/_proposals/<file>.md, with the user as
  the merge coordinator. The stated properties were: deliberate review of
  cold-layer changes, and safety for parallel agents via a serialization
  point. In real interactive use, this turned out to be ceremony.
decision: >
  Drop the proposal staging area and per-session sharding. Lex-crystallize
  proposes inline in conversation and applies on the user's yes. No
  _proposals/. No _active/. Concurrent-agent coordination is downgraded to
  "git, like any other shared file."
consequences: >
  The deliberate-review property is preserved by the Edit-approval loop and
  by Rule 6 (no drive-by edits to system.md). The serialization property is
  honestly absent — git is the recourse if multi-agent collisions actually
  happen, which they rarely do.
alternatives: >
  Keep proposals as opt-in. Rejected — a proposal mechanism that fires
  some-of-the-time is worse than none, because the user can't know which
  state they're in. Pick one shape and commit.
