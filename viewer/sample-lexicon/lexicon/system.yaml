schemaVersion: "0.3"
kind: system
id: lexicon
name: Lexicon
purpose: >
  A small workflow of skills that keeps the cold-layer model of a software
  project (vocabulary, invariants, bounded contexts, aggregates, shared
  kernels) aligned with the running code, across long human↔agent sessions.

contexts:
  - cold-layer
  - hot-layer
  - session-artifacts
  - design-system

sharedKernels:
  - id: temperature-layers
    name: Temperature layers
    description: >
      The cold / hot / cool vocabulary every lexicon skill uses to talk about
      where a piece of project knowledge lives.
    participatingContexts:
      - cold-layer
      - hot-layer
      - session-artifacts
    rationale: >
      All three skills speak in terms of "cold layer", "hot layer", "cool
      layer" — coordinated maintenance is the point.
    terms:
      - id: ubiquitous-language
        name: Ubiquitous Language
        category: concept
        definition: >
          The same nouns and verbs appear in system.yaml, in conversation, and
          in code. The single load-bearing primitive — when all three layers
          use the same vocabulary, mental-model alignment is enforced by
          repetition rather than by remembering.
      - id: cold-layer
        name: Cold layer
        category: concept
        definition: >
          The structured store of vocabulary, invariants, bounded contexts,
          aggregates, and rationale fields. Evolves at the speed of learning,
          not the speed of typing.
      - id: hot-layer
        name: Hot layer
        category: concept
        definition: >
          Per-feature plans, born when work starts and absorbed (crystallized)
          or discarded when work lands.
      - id: cool-layer
        name: Cool layer
        category: concept
        definition: >
          The session-artifacts tier — retros, audit reports, migrate reports.
          Almost never read in any single session; aggregated by lex-crystallize
          when the user asks. The volume is the point: the question gets asked
          every time without demanding attention.
    invariants:
      - id: ownership-one
        name: Exactly-one ownership
        statement: >
          Every Term has exactly one owning location — a single bounded
          context or a shared kernel.
        rationale: >
          Without ownership, the same term gets redefined in two places with
          quietly diverging meanings.

deliberateOmissions:
  - topic: Concurrent-agent coordination
    reason: >
      Multi-agent collisions on the same repo are handled by git, like any
      other shared file. Lexicon stays out of git's job.
  - topic: Significance scoring
    reason: >
      The agent is the worst possible judge of "is this significant?".
      Structural triggers replace subjective scoring.
