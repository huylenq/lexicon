schemaVersion: "0.3"
kind: bounded-context
id: cold-layer
name: Cold Layer
subdomain: core
purpose: >
  The slow-evolving store of project vocabulary, invariants, bounded contexts,
  shared kernels, and rationale — what the code cannot express well on its own.
codeModules:
  - skills/lex-overview/**
  - skills/lex-bootstrap/**
  - skills/lex-crystallize/**
  - skills/lex-audit/**
terms:
  - id: term
    name: Term
    category: concept
    definition: >
      A glossary entry — the atom of the ubiquitous language. Identified by a
      stable slug; carries a display name, a definition, optional
      disambiguations, and optional code anchors.
    disambiguatesFrom:
      - design-system/component
    symbols:
      - file: skills/lex-overview/SKILL.md
        lineStart: 76
        lineEnd: 78
        symbol: "Vocabulary check"
  - id: invariant
    name: Invariant
    category: concept
    definition: >
      A property that must hold across the system (or a context). Carries a
      statement, a rationale, and optionally code that constrains it.
    symbols:
      - file: skills/lex-overview/SKILL.md
        lineStart: 79
        lineEnd: 79
  - id: bounded-context
    name: Bounded Context
    category: concept
    definition: >
      A DDD primitive made first-class in lexicon. A region of the model
      within which terms have a single, consistent meaning. Owns Terms,
      Invariants, Seams, Boundary Rules, Aggregates, and Modules.
    symbols:
      - file: skills/lex-overview/SKILL.md
        lineStart: 80
        lineEnd: 80
  - id: boundary-rule
    name: Boundary Rule
    category: concept
    definition: >
      A directed normative rule between two bounded contexts, e.g. "Inference
      never writes to the training store."
  - id: architecture-seam
    name: Architecture Seam
    category: concept
    definition: >
      A structural joint between modules or contexts, typed by one of Evans'
      eight context-map relationship kinds. Distinct from a Boundary Rule —
      a seam is structural, a rule is normative.
  - id: deliberate-omission
    name: Deliberate Omission
    category: concept
    definition: >
      A topic deliberately not specified, and why. Makes boundaries explicit
      by naming what is intentionally outside the model.
invariants:
  - id: small-cold-doc
    name: Cold doc stays small
    statement: >
      The cold layer's holistic entry point stays under ~500 lines. Beyond
      that, partition into per-context files under lexicon/contexts/.
    rationale: >
      The cold doc rots if it tries to mirror code. The size bound forces
      compression and keeps the layer cold.
    validationMode: linter
  - id: term-ownership
    name: Exactly-one ownership for Terms
    statement: >
      Every Term has exactly one owning location — a single bounded context
      or a shared kernel.
    rationale: >
      Without ownership, the same term gets defined twice with slowly
      diverging meanings. This is the single failure mode lexicon is most
      prone to, and the reason shared kernels are typed rather than left as
      an untyped cross-cutting bag.
    validationMode: code
    constrainsCode:
      - file: skills/lex-audit/SKILL.md
        lineStart: 73
        lineEnd: 87
        symbol: "Phase 1b — UL ownership validation"
seams:
  - id: cold-hot-seam
    name: Cold ↔ Hot seam
    kind: open-host-service
    description: >
      Plans (hot layer) reference Terms, BoundedContexts and Invariants
      (cold layer) via typed anchors. Cold layer publishes the vocabulary
      and never references plans.
    rationale: >
      Open-host-service: cold-layer offers a stable integration surface
      (typed atoms with stable slugs) that any downstream — hot-layer plans,
      the viewer, audit tooling — can consume. Cold doesn't care which
      downstream is integrating; downstream conforms to the published shape.
    upstream: cold-layer
    downstream: hot-layer
boundaryRules:
  - id: no-drive-by-edits
    rule: >
      Cold-layer edits do not happen as drive-by side effects of unrelated
      work. They route through lex-crystallize with explicit human review.
    from: hot-layer
    to: cold-layer
    rationale: >
      Drive-by edits accumulate silent drift in exactly the layer that must
      stay aligned with the human's mental model. Routing edits through
      crystallize forces deliberate propose-then-apply discipline.
