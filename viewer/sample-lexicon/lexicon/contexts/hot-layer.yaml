schemaVersion: "0.3"
kind: bounded-context
id: hot-layer
name: Hot Layer
subdomain: supporting
purpose: >
  Per-feature plans. Born when work starts, absorbed into the cold layer
  (crystallized) or discarded when work lands.
codeModules:
  - skills/lex-ground/**
terms:
  - id: plan
    name: Plan
    category: concept
    definition: >
      A feature-scoped record with anchors back into the cold layer: terms
      used, contexts touched, invariants depended on, invariants potentially
      affected. The Anchors field is the typed link from hot to cold.
    symbols:
      - file: skills/lex-bootstrap/templates/plan.md.template
        lineStart: 11
        lineEnd: 16
        symbol: "Anchors in system.md"
  - id: anchors
    name: Anchors
    category: value
    definition: >
      Typed references from a Plan back into the cold layer. The single
      mechanically-checkable link between hot and cold.
    equality: >
      By the fqid of the referenced atom. Two Anchors with the same fqid
      point to the same cold-layer entity.
invariants:
  - id: anchors-resolve
    name: Plan anchors must resolve
    statement: >
      Every cold-layer reference in a Plan must point to an entity that
      exists at land-time.
    rationale: >
      Dangling anchors mean a plan referenced something that was renamed or
      removed without the plan being updated — the silent-drift bug at the
      hot↔cold boundary.
    validationMode: code
