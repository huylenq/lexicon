schemaVersion: "0.3"
kind: bounded-context
id: session-artifacts
name: Session Artifacts
subdomain: supporting
purpose: >
  The cool tier — per-session logs, audit reports, bootstrap reports, migration
  reports. Records, not aggregates with mutable state.
codeModules:
  - skills/lex-retro/**
  - skills/lex-audit/**
terms:
  - id: retro
    name: Retro
    category: concept
    definition: >
      An always-written session log. Carries a session summary and zero or
      more structural-check flags. Aggregated by lex-crystallize.
    symbols:
      - file: skills/lex-retro/SKILL.md
        lineStart: 1
        lineEnd: 30
  - id: audit-report
    name: Audit Report
    category: concept
    definition: >
      A per-phase backward-flow validation of the cold layer against current
      code. Read-mostly: never edits the cold layer, only triages.
    symbols:
      - file: skills/lex-audit/SKILL.md
        lineStart: 1
        lineEnd: 50
  - id: crystallization-marker
    name: Crystallization Marker
    category: concept
    definition: >
      An ISO timestamp at lexicon/.last-crystallized. Lex-crystallize reads
      retros newer than this. Trivial file, load-bearing role.
  - id: migrate-report
    name: Migrate Report
    category: concept
    definition: >
      The append-only log lex-migrate writes at lexicon/migrate.md. One section
      per applied delta, recording lifts, renames, classifications, and any
      autonomous decisions made during pilot-mode runs.
    symbols:
      - file: skills/lex-migrate/SKILL.md
invariants:
  - id: retro-always-runs
    name: Retro always runs
    statement: >
      Most retros log only a session summary. Conditional execution is
      rejected — the point is that the question gets asked every time.
    rationale: >
      Skipping retro for "obviously trivial" sessions imports the same
      significance-judgment failure mode the structural checks were designed
      to avoid.
