schemaVersion: "0.1"
kind: decision
id: ADR-0005
title: Prefs are user-level, not project-level (v0.7.0)
date: "2026-05-05"
status: accepted
supersedes:
  - ADR-0000
affects:
  - session-artifacts/prefs
context: >
  v0.1.0–v0.6.0 had lexicon/calibration.md per project. Three things went
  wrong: same lessons re-learned every project, narrow significance-only
  axis, and nobody actually writes to it (activation energy is too high).
decision: >
  Replace per-project calibration with a single user-level
  ~/src/lexicon/lexicon-prefs.md, sectioned Workflow / Style / Calibration
  / Patterns. Captured by the explicit trigger phrase "for lexicon: <X>".
  Skills append on the user's behalf.
consequences: >
  Calibration lessons propagate across projects. Project-specific overrides
  go in the project's CLAUDE.md (its natural home). The prefs file is a
  live override of skill defaults and a curation buffer — stabilized
  entries get absorbed into the SKILL.md bodies and pruned.
alternatives: >
  A new lex-feedback skill. Rejected — lexicon already has five skills,
  the taxonomy is hard to remember. Fold the capture behavior into
  lex-retro and lex-crystallize.
