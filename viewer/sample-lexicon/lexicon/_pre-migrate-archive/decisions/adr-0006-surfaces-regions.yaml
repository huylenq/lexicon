schemaVersion: "0.1"
kind: decision
id: ADR-0006
title: Surfaces and regions as a design-system tier (v0.8.0)
date: "2026-05-10"
status: accepted
affects:
  - design-system/surface
  - design-system/region
context: >
  v0.6.0 named tokens, components, layout primitives, interaction patterns,
  and a11y invariants as the design-system tiers. Real use on Eir exposed
  a missing tier — the named layout zones inside a specific surface ("the
  right sidebar of the composer view"). Without names, neither the team
  nor the agent can refer to them precisely; without precise references,
  retros can't flag drift in them.
decision: >
  Add Surfaces and Regions as a fifth design-system tier. A Region earns
  a name when the team refers to it as a discrete piece — full stop.
  Implementation status (Component vs Inline file:lineStart–lineEnd) is
  metadata recorded as a tag, not a gate on naming. Audit distinguishes
  "extracted-but-tag-still-says-inline" (tag drift) from "deleted" (real
  dead-region candidate).
consequences: >
  Future extractions are tag updates, not vocabulary changes. The cold
  layer carries the names; the platform decides what the rendered
  manifestation looks like (web aside/main, SwiftUI Sidebar, Flutter
  Drawer, terminal panes, etc.).
alternatives: >
  Rule: "inline divs don't earn names." Rejected — it collapsed two
  orthogonal axes (conceptual identity vs implementation status) and
  hid meaningful regions whose code happened to be inline.
