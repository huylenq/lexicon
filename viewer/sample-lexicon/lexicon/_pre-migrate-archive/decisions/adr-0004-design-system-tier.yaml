schemaVersion: "0.1"
kind: decision
id: ADR-0004
title: Design vocabulary extends system.md (v0.6.0)
date: "2026-05-01"
status: accepted
affects:
  - design-system/design-token
  - design-system/component
  - design-system/surface
context: >
  Design systems and DDD's ubiquitous language are the same primitive
  applied to different surfaces. The failure modes rhyme — silent renaming,
  invariants that quietly erode, boundary leaks. Splitting into a parallel
  skill bundle doubles ceremony for no extra reach.
decision: >
  Extend system.md with a `## Design system` section covering tokens,
  components, layout primitives, interaction patterns, accessibility
  invariants. Promote to lexicon/views/design-system.md when the surface
  gets rich. The same six structural checks pick up design-system drift —
  no new machinery.
consequences: >
  Backend-only projects continue to delete the section; nothing changes
  for them. Frontend-rich projects gain typed vocabulary for tokens and
  components, surfaced by the existing retro/crystallize/audit loop.
alternatives: >
  Fork a lex-design-* skill family. Rejected — the underlying primitive
  is the same; the right move is sharper triggering language in existing
  skills, not parallel bundles.
